<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NextThing 任务管理 UI V1</title>
  <style>
    :root {
      --brand: #6f61e8;
      --brand-deep: #5043ba;
      --brand-soft: #efedff;
      --ink: #20202a;
      --secondary: #666776;
      --muted: #9a9aa6;
      --line: #ecebf1;
      --page: #f7f7fa;
      --card: #ffffff;
      --danger: #e45e68;
      --danger-soft: #fff0f1;
      --warning: #d98938;
      --success: #33a278;
      --shadow: 0 28px 70px rgba(41, 37, 83, .14);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 0%, rgba(111, 97, 232, .15), transparent 30%),
        linear-gradient(145deg, #f9f8fc, #eeeeF5);
      font-family: "Segoe UI Variable", "HarmonyOS Sans SC", "Noto Sans SC",
        "Microsoft YaHei UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .workspace {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 310px minmax(460px, 1fr);
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 34px 25px;
      background: rgba(255, 255, 255, .78);
      border-right: 1px solid rgba(74, 67, 128, .09);
      backdrop-filter: blur(22px);
    }

    .eyebrow {
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
    }

    h1 {
      margin: 8px 0 10px;
      font-size: 28px;
      letter-spacing: -.04em;
    }

    .lead {
      margin: 0 0 25px;
      color: var(--secondary);
      font-size: 13px;
      line-height: 1.75;
    }

    .state-list {
      display: grid;
      gap: 7px;
    }

    .state-button {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 9px;
      align-items: center;
      width: 100%;
      padding: 11px 12px;
      color: var(--secondary);
      background: transparent;
      border: 0;
      border-radius: 14px;
      text-align: left;
    }

    .state-button:hover { background: #f5f3ff; }
    .state-button.active {
      color: var(--brand-deep);
      background: var(--brand-soft);
      font-weight: 750;
    }

    .state-no {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 9px;
      font-size: 11px;
      font-weight: 800;
    }

    .active .state-no {
      color: #fff;
      background: var(--brand);
      border-color: var(--brand);
    }

    .principles {
      margin-top: 26px;
      padding: 16px;
      color: #5f6070;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      font-size: 12px;
      line-height: 1.75;
    }

    .principles strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 13px;
    }

    main {
      min-width: 0;
      display: grid;
      place-items: center;
      padding: 34px;
    }

    .stage { width: min(100%, 860px); }

    .stage-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .stage-header h2 {
      margin: 5px 0 0;
      font-size: 22px;
      letter-spacing: -.02em;
    }

    .stage-note {
      max-width: 440px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      text-align: right;
    }

    .phone {
      position: relative;
      width: 390px;
      height: 844px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--page);
      border: 8px solid #191923;
      border-radius: 48px;
      box-shadow: var(--shadow);
    }

    .phone::before {
      content: "";
      position: absolute;
      z-index: 30;
      top: 10px;
      left: 50%;
      width: 116px;
      height: 27px;
      transform: translateX(-50%);
      background: #191923;
      border-radius: 18px;
    }

    .screen {
      height: 100%;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 92% 1%, rgba(111, 97, 232, .065), transparent 25%),
        var(--page);
    }

    .statusbar {
      height: 43px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      font-size: 12px;
      font-weight: 800;
    }

    .header {
      flex: 0 0 auto;
      padding: 7px 20px 8px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .week-title {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .header h3 {
      margin: 0;
      font-size: 21px;
      font-weight: 650;
      letter-spacing: -.025em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .week-stepper {
      display: grid;
      width: 15px;
      overflow: hidden;
      background: transparent;
      border: 0;
      border-radius: 5px;
    }

    .week-stepper button {
      height: 10px;
      padding: 0;
      color: #898997;
      background: transparent;
      border: 0;
      font-size: 7px;
      line-height: 1;
    }

    .week-stepper button + button {
      border-top: 0;
    }

    .circle-button {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      color: #555563;
      background: rgba(255,255,255,.88);
      border: 1px solid var(--line);
      border-radius: 50%;
      box-shadow: 0 6px 18px rgba(48, 46, 76, .05);
    }

    .search-icon {
      width: 14px;
      height: 14px;
      border: 1.6px solid currentColor;
      border-radius: 50%;
      position: relative;
    }

    .search-icon::after {
      content: "";
      position: absolute;
      right: -4px;
      bottom: -3px;
      width: 6px;
      height: 1.6px;
      background: currentColor;
      transform: rotate(45deg);
      border-radius: 2px;
    }

    .sliders-icon {
      width: 15px;
      height: 13px;
      background:
        linear-gradient(currentColor,currentColor) 0 2px/15px 1.3px no-repeat,
        linear-gradient(currentColor,currentColor) 0 6.5px/15px 1.3px no-repeat,
        linear-gradient(currentColor,currentColor) 0 11px/15px 1.3px no-repeat;
      position: relative;
    }

    .sliders-icon::after {
      content: "";
      position: absolute;
      width: 3px;
      height: 3px;
      border: 1.3px solid currentColor;
      border-radius: 50%;
      left: 3px;
      top: 0;
      box-shadow: 7px 4.5px 0 -1.3px #fff, 7px 4.5px 0 0 currentColor,
                  -1px 9px 0 -1.3px #fff, -1px 9px 0 0 currentColor;
      background: #fff;
    }

    .view-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-top: 10px;
      padding: 3px;
      background: #ecebf2;
      border-radius: 13px;
    }

    .view-switch button {
      padding: 8px 10px;
      color: var(--secondary);
      background: transparent;
      border: 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 650;
    }

    .view-switch button.active {
      color: var(--ink);
      background: #fff;
      box-shadow: 0 3px 10px rgba(37, 35, 58, .08);
    }

    .status-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      padding: 2px 16px 10px;
    }

    .status-tab {
      min-width: 0;
      padding: 8px 3px;
      color: var(--secondary);
      background: transparent;
      border: 0;
      border-radius: 11px;
      font-size: 11px;
      white-space: nowrap;
    }

    .status-tab.active {
      color: var(--brand-deep);
      background: var(--brand-soft);
      font-weight: 650;
    }

    .status-tab.overdue-active {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .active-filter-row {
      display: flex;
      gap: 7px;
      overflow: hidden;
      padding: 0 20px 10px;
    }

    .filter-pill {
      flex: 0 0 auto;
      padding: 7px 11px;
      color: var(--secondary);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
    }

    .filter-pill.active {
      color: var(--brand-deep);
      background: var(--brand-soft);
      border-color: transparent;
      font-weight: 650;
    }

    .content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 16px 104px;
      scrollbar-width: none;
    }
    .content::-webkit-scrollbar { display: none; }

    .group { margin-bottom: 18px; }

    .group-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3px 9px;
    }

    .group-title strong { font-size: 14px; }
    .group-title span { color: var(--muted); font-size: 12px; }

    .task-list {
      overflow: hidden;
      background: var(--card);
      border: 1px solid rgba(31, 31, 40, .045);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(42, 40, 66, .045);
    }

    .task {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 15px 14px;
      border-bottom: 1px solid var(--line);
    }
    .task:last-child { border-bottom: 0; }

    .task-main { min-width: 0; }
    .task-title {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
    }
    .task.done .task-title {
      color: var(--muted);
      text-decoration: line-through;
    }

    .next-badge {
      padding: 3px 6px;
      color: var(--brand-deep);
      background: var(--brand-soft);
      border-radius: 6px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .03em;
      text-decoration: none;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .category-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand);
    }
    .category-dot.life { background: #48a886; }
    .category-dot.study { background: #4f8edb; }

    .task-time {
      padding-top: 3px;
      color: var(--secondary);
      font-size: 11px;
      font-weight: 650;
    }
    .task-time.late { color: var(--danger); }

    .search-panel {
      padding: 8px 8px 10px;
    }

    .search-page-head {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 0;
      align-items: start;
    }

    .back-button {
      width: 38px;
      height: 38px;
      padding: 0 0 2px 6px;
      color: var(--secondary);
      background: transparent;
      border: 0;
      border-radius: 12px;
      font-size: 32px;
      line-height: 1;
      text-align: left;
    }

    .search-box {
      display: grid;
      grid-template-columns: 18px 1fr auto auto;
      gap: 9px;
      align-items: center;
      height: 44px;
      padding: 0 13px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 7px 20px rgba(42, 40, 66, .045);
    }
    .search-box input {
      width: 100%;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 13px;
    }
    .ai-button {
      padding: 6px 9px;
      color: var(--brand-deep);
      background: var(--brand-soft);
      border: 0;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 750;
    }

    .search-filter-button {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      color: var(--secondary);
      background: transparent;
      border: 0;
      border-left: 1px solid var(--line);
    }

    .result-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 3px 11px;
      color: var(--secondary);
      font-size: 12px;
    }

    .result-summary span:last-child {
      color: var(--muted);
      font-size: 10px;
    }

    .screen.search-mode .header,
    .screen.search-mode .status-tabs {
      display: none;
    }

    .screen.search-mode .bottom-nav {
      display: none;
    }

    .screen.search-mode .content {
      padding-bottom: 24px;
    }

    .screen.search-mode #dynamicArea {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .ai-voice-page {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0 28px 38px;
    }

    .ai-back-only {
      position: absolute;
      top: 2px;
      left: 8px;
      z-index: 2;
    }

    .ai-voice-center {
      flex: 1;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .ai-voice-center h4 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -.02em;
    }

    .ai-voice-center p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .ai-example {
      margin-top: 12px;
      color: var(--secondary);
      font-size: 11px;
    }

    .voice-press-area {
      padding-bottom: 24px;
      text-align: center;
    }

    .voice-press-hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 11px;
    }

    .voice-orb {
      display: grid;
      width: 94px;
      height: 94px;
      margin: 0 auto;
      place-items: center;
      color: #fff;
      background:
        radial-gradient(circle at 34% 28%, #9589ff, transparent 34%),
        linear-gradient(145deg, #7666f4, #5748d2);
      border: 0;
      border-radius: 50%;
      box-shadow:
        0 18px 38px rgba(91,73,211,.28),
        0 0 0 12px rgba(111,97,232,.07);
    }

    .voice-orb .mic-icon {
      position: relative;
      width: 16px;
      height: 27px;
      border: 2.5px solid #fff;
      border-radius: 10px;
    }

    .voice-orb .mic-icon::before {
      content: "";
      position: absolute;
      left: -8px;
      bottom: -9px;
      width: 27px;
      height: 17px;
      border: solid #fff;
      border-width: 0 2.5px 2.5px;
      border-radius: 0 0 15px 15px;
    }

    .voice-orb .mic-icon::after {
      content: "";
      position: absolute;
      left: 5px;
      bottom: -16px;
      width: 2.5px;
      height: 8px;
      background: #fff;
      border-radius: 2px;
    }

    .transcript-backdrop {
      position: absolute;
      z-index: 45;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(27,26,37,.28);
      backdrop-filter: blur(4px);
    }

    .transcript-dialog {
      width: 100%;
      padding: 20px;
      background: #fff;
      border-radius: 21px;
      box-shadow: 0 24px 60px rgba(33,30,57,.2);
    }

    .transcript-dialog h4 {
      margin: 0 0 13px;
      font-size: 16px;
    }

    .transcript-text {
      padding: 14px;
      color: var(--ink);
      background: #f6f5fa;
      border-radius: 13px;
      font-size: 13px;
      line-height: 1.65;
    }

    .dialog-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 17px;
    }

    .dialog-actions button {
      height: 42px;
      color: var(--secondary);
      background: #f4f3f7;
      border: 0;
      border-radius: 13px;
      font-weight: 650;
    }

    .dialog-actions button.primary {
      color: #fff;
      background: var(--brand);
      box-shadow: 0 8px 20px rgba(111,97,232,.22);
    }

    .ai-result-head {
      display: grid;
      grid-template-columns: 38px 1fr;
      align-items: start;
      padding: 2px 8px 8px;
    }

    .ai-result-label {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 38px;
      padding: 8px 4px 6px;
      color: var(--brand-deep);
      font-size: 12px;
      font-weight: 600;
    }

    .search-empty-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 17px;
    }

    .search-empty-actions button {
      padding: 9px 12px;
      color: var(--secondary);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 11px;
      font-size: 11px;
    }

    .search-empty-actions button.primary {
      color: var(--brand-deep);
      background: var(--brand-soft);
      border-color: transparent;
      font-weight: 650;
    }

    .calendar-card {
      padding: 15px;
      background: #fff;
      border: 1px solid rgba(31, 31, 40, .045);
      border-radius: 19px;
      box-shadow: 0 8px 24px rgba(42, 40, 66, .045);
    }

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    .calendar-head strong { font-size: 16px; }

    .weekdays, .dates {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }
    .weekdays {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 10px;
    }
    .date {
      position: relative;
      display: grid;
      height: 39px;
      place-items: center;
      color: var(--secondary);
      font-size: 12px;
      border-radius: 12px;
    }
    .date.muted { color: #d1d0d7; }
    .date.selected {
      color: #fff;
      background: var(--brand);
      font-weight: 750;
    }
    .date.has-task:not(.selected)::after {
      content: "";
      position: absolute;
      bottom: 4px;
      width: 3px;
      height: 3px;
      background: var(--brand);
      border-radius: 50%;
    }

    .selected-day {
      margin-top: 13px;
    }

    .empty {
      min-height: 440px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .empty-mark {
      width: 62px;
      height: 62px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      color: var(--brand);
      background: var(--brand-soft);
      border-radius: 21px;
      font-size: 26px;
    }
    .empty h4 { margin: 0 0 7px; font-size: 16px; }
    .empty p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .bottom-nav {
      position: absolute;
      z-index: 20;
      right: 12px;
      bottom: 12px;
      left: 12px;
      height: 66px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      padding: 5px 6px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(224,223,232,.9);
      border-radius: 22px;
      box-shadow: 0 12px 35px rgba(37, 35, 58, .12);
      backdrop-filter: blur(18px);
    }

    .nav-item {
      display: grid;
      gap: 4px;
      place-items: center;
      color: var(--muted);
      background: transparent;
      border: 0;
      font-size: 9px;
    }
    .nav-symbol {
      width: 21px;
      height: 18px;
      display: grid;
      place-items: center;
      font-size: 16px;
    }
    .nav-item.active { color: var(--brand); font-weight: 750; }
    .nav-item.create .nav-symbol {
      width: 33px;
      height: 33px;
      margin-top: -13px;
      color: #fff;
      background: var(--brand);
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(111,97,232,.28);
      font-size: 22px;
    }

    .sheet-backdrop {
      position: absolute;
      z-index: 40;
      inset: 0;
      display: none;
      align-items: end;
      background: rgba(24, 23, 33, .28);
      backdrop-filter: blur(2px);
    }
    .sheet-backdrop.visible { display: flex; }

    .sheet {
      width: 100%;
      padding: 10px 19px 25px;
      background: #fbfbfd;
      border-radius: 28px 28px 0 0;
      box-shadow: 0 -20px 60px rgba(30, 28, 50, .15);
    }

    .sheet-handle {
      width: 38px;
      height: 5px;
      margin: 0 auto 18px;
      background: #d5d4dc;
      border-radius: 999px;
    }

    .sheet-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .sheet-title strong { font-size: 18px; }
    .sheet-title button {
      color: var(--brand);
      background: transparent;
      border: 0;
      font-size: 12px;
    }

    .filter-section { margin-bottom: 18px; }
    .filter-section label {
      display: block;
      margin-bottom: 9px;
      color: var(--secondary);
      font-size: 12px;
      font-weight: 700;
    }
    .options { display: flex; flex-wrap: wrap; gap: 8px; }
    .option {
      padding: 9px 12px;
      color: var(--secondary);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 12px;
    }
    .option.selected {
      color: var(--brand-deep);
      background: var(--brand-soft);
      border-color: transparent;
      font-weight: 700;
    }

    .apply {
      width: 100%;
      height: 48px;
      margin-top: 4px;
      color: #fff;

      if (location.hash !== `#${state}`) {
        history.replaceState(null, "", `#${state}`);
      }
      document.querySelectorAll(".state-button").forEach(button => {
        button.classList.toggle("active", button.dataset.state === state);
      });

      document.getElementById("stageTitle").textContent = stateMeta[state][0];
      document.getElementById("stageNote").textContent = stateMeta[state][1];
      filterSheet.classList.remove("visible");
      searchFilterSheet.classList.remove("visible");
      const isSearchState =
        state === "search" ||
        state === "search-empty" ||
        state === "ai-search" ||
        state === "ai-confirm" ||
        state === "ai-results";
      screen.classList.toggle("search-mode", isSearchState);

      const isCalendar = state === "calendar";
      listViewButton.classList.toggle("active", !isCalendar);
      calendarViewButton.classList.toggle("active", isCalendar);
      pageTitle.textContent = isCalendar ? "2026年6月" : "6月15日 - 6月21日";
      weekStepper.style.display = isCalendar ? "none" : "grid";

      if (state === "search") {
        dynamicArea.innerHTML = searchContent;
        selectStatusVisual("pending");
      }
      else if (state === "ai-search") {
        dynamicArea.innerHTML = aiSearchContent;
        selectStatusVisual("pending");
      }
      else if (state === "ai-confirm") {
        dynamicArea.innerHTML = aiConfirmContent;
        selectStatusVisual("pending");
      }
      else if (state === "ai-results") {
        dynamicArea.innerHTML = aiResultsContent;
        selectStatusVisual("pending");
      }
      else if (state === "search-empty") {
        dynamicArea.innerHTML = searchEmptyContent;
        selectStatusVisual("pending");
      }
      else if (state === "completed") selectStatus("completed");
      else if (state === "calendar") {
        dynamicArea.innerHTML = calendarContent;
        selectStatusVisual("pending");
      }
      else if (state === "empty") {
        dynamicArea.innerHTML = emptyContent;
        selectStatusVisual("pending");
      }
      else selectStatus("pending");

      if (state === "filter") filterSheet.classList.add("visible");
    }

    function selectStatusVisual(status) {
      document.querySelectorAll(".status-tab").forEach(button => {
        const selected = button.dataset.status === status;
        button.classList.toggle("active", selected);
        button.classList.toggle("overdue-active", selected && status === "overdue");
      });
    }

    document.querySelectorAll(".state-button").forEach(button => {
      button.addEventListener("click", () => render(button.dataset.state));
    });

    document.getElementById("filterButton").addEventListener("click", () => {
      render("filter");
    });
    document.getElementById("searchButton").addEventListener("click", () => {
      render("search");
    });
    listViewButton.addEventListener("click", () => render("default"));
    calendarViewButton.addEventListener("click", () => render("calendar"));
    document.querySelectorAll(".status-tab").forEach(button => {
      button.addEventListener("click", () => {
        const status = button.dataset.status;
        pageTitle.textContent = "6月15日 - 6月21日";
        weekStepper.style.display = "grid";
        listViewButton.classList.add("active");
        calendarViewButton.classList.remove("active");
        selectStatus(status);
        document.getElementById("stageTitle").textContent =
          status === "pending" ? "默认周列表" :
          status === "overdue" ? "逾期任务" :
          status === "completed" ? "已完成任务" : "已取消任务";
      });
    });
    document.getElementById("applyFilter").addEventListener("click", () => render("default"));
    document.getElementById("resetFilter").addEventListener("click", () => render("default"));
    document.getElementById("applySearchFilter").addEventListener("click", () => {
      searchFilterSheet.classList.remove("visible");
    });
    document.getElementById("resetSearchFilter").addEventListener("click", () => {
      searchFilterSheet.classList.remove("visible");
    });
    filterSheet.addEventListener("click", event => {
      if (event.target === filterSheet) render("default");
    });
    searchFilterSheet.addEventListener("click", event => {
      if (event.target === searchFilterSheet) searchFilterSheet.classList.remove("visible");
    });
    dynamicArea.addEventListener("click", event => {
      if (event.target.closest(".back-button")) render("default");
      if (event.target.closest(".search-filter-button")) searchFilterSheet.classList.add("visible");
      if (event.target.closest(".ai-button") || event.target.closest(".ai-empty-button")) {
        render("ai-search");
      }
      if (event.target.closest(".voice-orb")) render("ai-confirm");
      if (event.target.closest(".cancel-ai-search")) render("ai-search");
      if (event.target.closest(".confirm-ai-search")) render("ai-results");
    });
    document.querySelectorAll(".option").forEach(option => {
      option.addEventListener("click", () => option.classList.toggle("selected"));
    });

    const requestedState = location.hash.slice(1);
    render(stateMeta[requestedState] ? requestedState : "default");
  </script>
</body>
</html>
